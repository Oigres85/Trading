# Test del motore (JS + Python) a ogni push che tocca codice — NON blocca gli
# aggiornamenti dati (quello è update-data.yml col suo audit_data.py).
name: tests
on:
  push:
    branches: [main]
    paths: ["assets/**", "scripts/**", "index.html", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Sintassi + test motore JS (vm, DOM-stub)
        run: |
          node --check assets/app.js
          node scripts/test_app.mjs

      # AUTOCONTROLLO (v277, gate HARD): guarda il SISTEMA, non i dati. Nasce da due errori
      # fatti nello stesso giorno che NESSUN gate ha preso, perche' tutti gli altri controllano
      # il prodotto e nessuno l'operazione che lo modifica:
      #   · quattro funzioni DUPLICATE da una rimozione (in JS la seconda vince in silenzio:
      #     il file girava e 120 check passavano);
      #   · una suite tagliata a meta' che usciva 0 SENZA STAMPARE NIENTE — verde per assenza
      #     di test. Questo gate esegue ogni suite e pretende che parli.
      # Sta DOPO test_app perche' lo esegue a sua volta, e separato perche' una delle cose che
      # sorveglia e' che le suite non vengano svuotate.
      - name: Autocontrollo del sistema (duplicati, suite vive, riferimenti orfani)
        run: node scripts/self_check.mjs

      # VERIFICA SORGENTI (v278): sintassi di ogni file sorgente. E' l'ultima rete dopo l'hook
      # pre-commit — che pero' vive sulla macchina di chi committa, quindi qui si ricontrolla.
      - name: Verifica sintassi dei sorgenti
        run: python3 scripts/modifica_sicura.py

      # RED TEAM (v116, gate HARD): invarianti finanziari su tutte le combinazioni di
      # stato UI × scenari di dati avvelenati. Codice che può produrre un ordine
      # impossibile (incidente SNDK: limite $40,1 / stop -$366) NON si pusha.
      - name: Red team invarianti motore
        run: node scripts/redteam.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Test funzioni pure pipeline (offline)
        run: python scripts/test_update_data.py
