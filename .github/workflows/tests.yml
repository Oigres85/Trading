# Test del motore (JS + Python) a ogni push che tocca codice — NON blocca gli
# aggiornamenti dati (quello è update-data.yml col suo audit_data.py).
#
# ⚠⚠ v389 — I TEST NON GIRAVANO SULLE PULL REQUEST, E NESSUNO POTEVA SAPERLO.
# Il trigger era `push` sul solo `main`: una PR poteva restare aperta per giorni con ZERO check
# (verificato sulla PR #85: `total_count: 0`), e i gate scattavano solo DOPO il merge — cioè
# dopo che il codice era già su main e la pagina già servita al CEO.
# Undici gate scritti con cura, e il momento in cui servono di più — prima del merge — era
# l'unico in cui non giravano. È la classe già scritta in questo progetto per il gate spento
# della v205: *un test che non può rompere la CI non è un test, è un commento*; qui non era
# spento, era solo puntato dopo il fatto.
# `pull_request` copre le PR verso main; `push` su main resta per i commit diretti.
name: tests
on:
  pull_request:
    branches: [main]
    paths: ["assets/**", "scripts/**", "index.html", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["assets/**", "scripts/**", "index.html", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Sintassi + test motore JS (vm, DOM-stub)
        run: |
          node --check assets/app.js
          node scripts/test_app.mjs

      # VERIFICA SORGENTI (v278): sintassi di ogni file sorgente. E' l'ultima rete dopo l'hook
      # pre-commit — che pero' vive sulla macchina di chi committa, quindi qui si ricontrolla.
      - name: Verifica sintassi dei sorgenti
        run: python3 scripts/modifica_sicura.py

      # RED TEAM (v116, gate HARD): invarianti finanziari su tutte le combinazioni di
      # stato UI × scenari di dati avvelenati. Codice che può produrre un ordine
      # impossibile (incidente SNDK: limite $40,1 / stop -$366) NON si pusha.
      - name: Red team invarianti motore
        run: node scripts/redteam.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Test funzioni pure pipeline (offline)
        run: python scripts/test_update_data.py

      # ⚠ v285 — L'AUTOCONTROLLO STA QUI, DOPO PYTHON, E NON PRIMA. Da v277 era il primo passo
      # dopo i test JS: ma self_check ESEGUE tutte le suite, compresa test_update_data.py che
      # importa numpy e pandas — e a quel punto del workflow `setup-python` e `pip install` non
      # erano ancora girati. Risultato: la suite falliva per una dipendenza assente, e
      # l'autocontrollo la segnalava come "non passa". LA CI E' STATA ROSSA PER OTTO VERSIONI
      # (v277→v284) e me l'ha dovuto dire il CEO: ho spinto senza mai guardare l'esito.
      # Un gate che esegue altri gate va messo dove tutte le loro dipendenze esistono gia'.
      # AUTOCONTROLLO (v277, gate HARD): guarda il SISTEMA, non i dati. Nasce da due errori
      # fatti nello stesso giorno che NESSUN gate ha preso, perche' tutti gli altri controllano
      # il prodotto e nessuno l'operazione che lo modifica:
      #   · quattro funzioni DUPLICATE da una rimozione (in JS la seconda vince in silenzio:
      #     il file girava e 120 check passavano);
      #   · una suite tagliata a meta' che usciva 0 SENZA STAMPARE NIENTE — verde per assenza
      #     di test. Questo gate esegue ogni suite e pretende che parli.
      # Sta DOPO test_app perche' lo esegue a sua volta, e separato perche' una delle cose che
      # sorveglia e' che le suite non vengano svuotate.
      - name: Autocontrollo del sistema (duplicati, suite vive, riferimenti orfani)
        run: node scripts/self_check.mjs

