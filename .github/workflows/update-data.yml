name: Aggiorna dati dashboard

on:
  schedule:
    # ⚠⚠ v437 — QUESTI ORARI NON SONO GLI ORARI IN CUI IL RUN PARTE, E NON LO SONO MAI STATI.
    # Misurato sui 100 run schedulati dal 01/09 al 09/09/2026: GitHub fa partire OGNI cron in
    # ritardo, sempre, da 99 a 263 minuti. L'aggancio slot->run e' forzato dalla causalita' sui
    # due giorni di weekend (11 slot, 11 run, e qualunque altro accoppiamento darebbe un run
    # PRIMA del proprio slot, che e' impossibile):
    #   04:00 -> +245/+263 min    05:00 -> +220/+239    08:00 -> +219/+238    09:00 -> +193/+208
    #   13:30 -> +159/+171        14:30 -> +144/+165    15:00 -> +122/+146    16:00 -> +116/+122
    #   19:00 -> +108/+116        20:00 -> +116/+117    21:00 ->  +99/+103
    #
    # Le sei ore ITALIANE che questo blocco dichiarava di servire cadono in realta' cosi':
    #   06:00 -> ~10:10     10:00 -> ~13:40     15:30 -> ~18:10
    #   17:00 -> ~19:05     21:00 -> ~22:50     22:00 -> ~00:40 del giorno dopo
    # Il ritardo VARIA di 2,7 volte, quindi non si compensa spostando il cron indietro: si
    # sposterebbe una distribuzione trattandola come una costante.
    #
    # PER QUESTO L'OROLOGIO E' USCITO DA GITHUB. Lo scheduler vero chiama dall'esterno
    # l'endpoint workflow_dispatch qui sotto — misurato il 09/09: run creato in <= 6 secondi,
    # contro i 99-263 minuti del cron — in fuso Europe/Rome, quindi senza il doppione CEST/CET
    # che vive in questo blocco. Ricetta, stato e verifica: memoria/OROLOGIO.md
    #
    # I CRON RESTANO COME RETE DI SICUREZZA, NON COME ORARIO: se lo scheduler esterno tace, i
    # dati si aggiornano lo stesso, in ritardo ma ci sono. Un dato in ritardo e' meglio di
    # nessun dato; un orario dichiarato e falso no, ed e' quello che questa versione ha tolto.
    # Le etichette qui sotto dicono lo slot NOMINALE e, accanto, dove atterra davvero.
    - cron: "0 4 * * *"     # nominale 06:00 CEST  -> reale ~10:10
    - cron: "0 5 * * *"     # nominale 06:00 CET   -> reale ~10:10
    - cron: "0 8 * * *"     # nominale 10:00 CEST  -> reale ~13:40
    - cron: "0 9 * * *"     # nominale 10:00 CET   -> reale ~13:40
    - cron: "30 13 * * *"   # nominale 15:30 CEST  -> reale ~18:10
    - cron: "30 14 * * *"   # nominale 15:30 CET   -> reale ~18:10
    - cron: "0 15 * * *"    # nominale 17:00 CEST  -> reale ~19:05
    - cron: "0 16 * * *"    # nominale 17:00 CET   -> reale ~19:05
    - cron: "0 19 * * *"    # nominale 21:00 CEST  -> reale ~22:50
    - cron: "0 20 * * *"    # nominale 21:00 CET / 22:00 CEST
    - cron: "0 21 * * *"    # nominale 22:00 CET   -> reale ~00:40
    # Rete oraria durante la sessione USA (giorni feriali). Anche questa arriva in ritardo, ma
    # essendo oraria il ritardo si traduce in copertura spostata, non in un buco.
    - cron: "0 13-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write        # canale UNICO notifiche: GitHub Issue (zero secret)

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ⚠ v444 — bump per la deprecazione di Node 20 (vedi tests.yml): la v5 dichiara
      # `using: node24`, che e' cio' su cui GitHub gia' forza la v4.
      # ⚠⚠ E `persist-credentials` E' DICHIARATO invece che ereditato. Il passo finale di questo
      # workflow fa un `git push` NUDO: funziona solo perche' il checkout lascia le credenziali
      # nel git config locale. Quella dipendenza era INVISIBILE — bastava un cambio di default
      # a monte e la pipeline avrebbe smesso di committare in silenzio, cioe' la classe che
      # questo progetto paga da sempre (v387, v433: un run degradato che si presenta come
      # riuscito). Verificato sul manifesto della v5: l'input esiste e il default e' `true`;
      # scriverlo non cambia niente oggi e toglie l'assunzione domani (regola v240).
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/update_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # opzionale: backup prezzi se Yahoo fallisce (registrazione gratuita su tiingo.com)
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

      # gate di qualità: violazioni matematiche hard (P/E con EPS<0, MCR rotto, stop
      # incoerenti) bloccano il commit dei dati; i degradi di mercato sono solo warning
      - run: python scripts/audit_data.py data/data.json

      # ⚠ v342 — IL PACCHETTO MACRO COME FILE PUBBLICO. Il CEO lavora con un assistente che
      # non puo' aprire la pagina: se il quadro macro esiste come file nel repo pubblico, se
      # lo scarica da solo a ogni conversazione e resta fresco perche' questa pipeline gira
      # su cron. Nessun copia-incolla.
      # ⚠ NON blocca il commit dei dati (continue-on-error): se il pacchetto non si genera,
      # i prezzi devono comunque arrivare. Un file macro vecchio si riconosce dalla data che
      # porta in testa; dati di mercato mancanti no.
      - name: Genera il pacchetto macro (data/macro_pack.txt)
        run: node scripts/emit_macro_pack.mjs
        continue-on-error: true

      # ⚠ v390 — IL PASSO "Log verdetti e track record" E' STATO RITIRATO.
      # `log_verdict.mjs` chiamava `decisionVerdict()` e `marketLinkText()`, rimosse con il
      # motore predittivo (v200, tolto perche' MISURATO: hit-rate 29%, sette punti peggio del
      # Nasdaq). Da allora falliva a OGNI run — "decisionVerdict is not defined" — e nessuno se
      # ne accorgeva: era `continue-on-error: true`, quindi un job verde con un passo morto
      # dentro. E' la stessa classe delle news di v389: un errore reso invisibile da una rete
      # di sicurezza sopravvive quanto la rete.
      # Il campo che produceva (`verdict_track`) non lo legge PIU' NESSUNO — verificato con
      # grep su tutto il repository. Rigenerarlo non serviva a nulla e riportarlo in vita
      # significherebbe reintrodurre il punteggio che il CEO ha tolto sui numeri.
      # ⚠ `config/verdict_history.jsonl` RESTA: sono 30 giorni di storia vera e `backtest_diary.mjs`
      # li legge per mostrare cosa diceva il sistema il giorno di ogni operazione del CEO.
      # Lo script resta nel repository, dormiente e con la sua lapide in testa: la misura del
      # sistema contro gli esiti la fanno `backtest_diary.mjs` e `backtest_signals.mjs`.

      # RED TEAM sui DATI FRESCHI (v116): gli invarianti finanziari del motore vengono
      # verificati su tutte le combinazioni di stato UI PRIMA del commit. Un fallimento
      # qui NON blocca i dati (il bug sarebbe nel codice, non nei prezzi) ma fa scattare
      # l'allarme: mai più scoprire un limite d'ordine folle leggendo il report.
      - name: Red team invarianti motore (dati freschi)
        id: redteam
        run: node scripts/redteam.mjs
        continue-on-error: true
      - name: Allarme red team
        if: steps.redteam.outcome == 'failure'
        # block scalar (>-): il messaggio contiene ": " che in uno scalare YAML piano
        # invalida il file (successo il 11/07: workflow rotto = dati fermi una notte)
        run: >-
          python scripts/notify_alerts.py --custom
          "RED TEAM FALLITO sul run dati — il motore ha violato gli invarianti
          finanziari con i dati freschi. NON usare il report finché non controlli
          la tab Actions."
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # notifiche alert (v113): stop violati / data quality / setup squeeze. Canale UNICO:
      # GitHub Issue (zero secret). WhatsApp/CallMeBot ed email SMTP rimossi (lug 2026).
      # ANTI-FRAGILE: lo script esce sempre 0; continue-on-error come seconda cintura.
      - name: Notifiche alert (best-effort)
        run: python scripts/notify_alerts.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Misure del libro (data/libro.json) — anche se la pipeline e' caduta
        if: always()
        run: |
          set +e
          python scripts/analisi_libro.py --compatto > /tmp/libro.json 2>/tmp/libro.err
          if [ -s /tmp/libro.json ] && python -c "import json,sys; json.load(open('/tmp/libro.json'))"; then
            mv /tmp/libro.json data/libro.json
            echo "libro.json aggiornato ($(wc -c < data/libro.json) byte)"
          else
            echo "misure del libro non calcolabili in questo run — il file precedente resta"
            cat /tmp/libro.err | tail -5
          fi
          exit 0

      - name: Commit dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # file di stato best-effort: possono non esistere ai primi run
          git add config/verdict_history.jsonl 2>/dev/null || true
          git add config/alert_state.json 2>/dev/null || true
          git diff --cached --quiet && echo "nessuna variazione" && exit 0
          git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M UTC')"
          # push robusto: riprova con rebase se il remote è avanzato
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rifiutato, riprovo con rebase ($i)…"
            git fetch origin main
            git rebase -X ours origin/main || git rebase --abort
            sleep 3
          done
          echo "push fallito dopo i tentativi" && exit 1

      # ⚠⚠ v370 — L'ALLARME STAVA DOPO IL FUSIBILE, quindi non e' mai scattato.
      # La pipeline e' rimasta rotta TRE GIORNI (12 run consecutivi falliti) e il CEO l'ha
      # scoperto da uno screenshot di GitHub, non dal sistema: `notify_alerts.py` gira agli step
      # 11 e 12, mentre a rompersi e' lo step 5 (`update_data.py`). Quando quello cade, tutti
      # gli step successivi sono `skipped` — cioe' il canale di allarme e' spento proprio nel
      # momento in cui esiste qualcosa da segnalare.
      # Questo step gira SOLO in caso di fallimento, e apre una Issue: `issues: write` c'e' gia'.
      - name: Allarme se la pipeline e' caduta
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          titolo="Pipeline caduta — run #${GITHUB_RUN_NUMBER}"
          # ⚠⚠ L'ETICHETTA VA CREATA, ALTRIMENTI L'ALLARME NON PUO' SUONARE. Misurato l'08/09/2026:
          # `pipeline` non esisteva nel repo, quindi `gh issue create --label pipeline` falliva con
          # "could not add label: 'pipeline' not found" e NESSUNA Issue veniva aperta. La pipeline
          # era caduta due volte quella mattina, i dati della dashboard erano fermi da quattordici
          # ore, e non c'era traccia da nessuna parte.
          # E' la classe gia' pagata con `log_verdict.mjs` (v390): un errore coperto da una rete di
          # sicurezza sopravvive quanto la rete — qui la rete era il `set +e` piu' l'`exit 0`, che
          # rendevano invisibile il fallimento dell'allarme stesso.
          # ⚠ `--force` rende il comando idempotente: si puo' eseguire a ogni caduta senza rumore.
          gh label create pipeline --color B60205 \
            --description "La pipeline dati e' caduta: i dati della dashboard sono fermi" --force
          # una sola Issue aperta per volta: un allarme che si ripete dieci volte si ignora
          aperta=$(gh issue list --state open --label pipeline --limit 1 --json number --jq '.[0].number')
          corpo="Il workflow \`${GITHUB_WORKFLOW}\` e' fallito.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}

          I dati sulla dashboard restano fermi all'ultimo run riuscito finche' questo non e' risolto.
          Per il log dello step caduto: \`gh run view ${GITHUB_RUN_ID} --log-failed\`"
          if [ -n "$aperta" ]; then
            gh issue comment "$aperta" --body "$corpo"
          else
            gh issue create --title "$titolo" --label pipeline --body "$corpo"
          fi
          exit 0
